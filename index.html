<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор | Функциональное программирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор</h1>
        <p class="subtitle">Функциональное программирование | TypeScript</p>
        
        <div class="display">
            <input type="text" id="display" readonly value="0">
        </div>
        
        <div class="buttons">
            <button class="btn number" data-value="7">7</button>
            <button class="btn number" data-value="8">8</button>
            <button class="btn number" data-value="9">9</button>
            <button class="btn operator" data-op="/">÷</button>
            
            <button class="btn number" data-value="4">4</button>
            <button class="btn number" data-value="5">5</button>
            <button class="btn number" data-value="6">6</button>
            <button class="btn operator" data-op="*">×</button>
            
            <button class="btn number" data-value="1">1</button>
            <button class="btn number" data-value="2">2</button>
            <button class="btn number" data-value="3">3</button>
            <button class="btn operator" data-op="-">−</button>
            
            <button class="btn number" data-value="0">0</button>
            <button class="btn number" data-value="."">.</button>
            <button class="btn operator" data-op="+">+</button>
            <button class="btn operator" data-op="=">=</button>
            
            <button class="btn function" id="sqrt">√</button>
            <button class="btn function" id="pow">xʸ</button>
            <button class="btn clear" id="clear">C</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
