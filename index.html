<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Список задач</h1>
        
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addBtn">Добавить</button>
        </div>
        
        <div class="filters">
            <button id="filterAll" class="active">Все</button>
            <button id="filterActive">Активные</button>
            <button id="filterCompleted">Выполненные</button>
        </div>
        
        <ul id="taskList"></ul>
    </div>
    
    <script src="lab2.js"></script>
</body>
</html>
